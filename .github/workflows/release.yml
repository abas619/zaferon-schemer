name: Release

# Tag a version and the build publishes itself: `git tag v1.0.2 && git push origin v1.0.2`.
# electron-updater reads the `latest.yml` / `latest-linux.yml` / `latest-mac.yml` this
# workflow uploads, so a tag is the only thing between a merged main branch and an update
# reaching installed apps.
on:
  push:
    tags:
      - 'v*'

permissions:
  # GITHUB_TOKEN is read-only by default in Actions. Without this, electron-builder
  # authenticates, fails to create the release and the run dies with a 403 — after
  # a full Windows build, which is the most expensive way to discover a typo.
  contents: write

jobs:
  # The node-only gates run once, before three platform builds are paid for. They are the
  # ones that catch the unrecoverable outcome: a release whose donation address is still
  # demo, or whose update wiring no longer lines up.
  #
  # The GUI harnesses (smoke / menu-audit / update-shots / support-check) are deliberately
  # NOT here. They need a display server, and a headless Electron that fails for X11
  # reasons reports the same exit code as one that fails for real reasons — a gate that
  # cannot distinguish those is worse than no gate. Run them locally before tagging.
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Release gates
        run: |
          npm run update-check
          npm run donate-check
          npm run store-test
          npm run css-check

  # One release, three runners. Each job publishes only its own platform, so the
  # artefacts and the `latest*.yml` files never collide: electron-updater reads a
  # per-platform feed file, and electron-builder's GitHub publisher treats an
  # already-existing release as "upload into it" rather than an error.
  release:
    needs: gates
    strategy:
      # A mac certificate problem must not cost someone their Windows update.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
          - os: macos-latest
            args: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # electron-builder's rpm target shells out to `rpmbuild`, which is not on the
      # ubuntu runner by default. Without it the linux job dies inside fpm, several
      # minutes after the AppImage and deb already succeeded.
      - name: Install rpm tooling
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:publish -- ${{ matrix.args }}

  # electron-builder's GitHub publisher creates the release as a **draft** and never
  # publishes it (gitHubPublisher.js: `this.releaseType = options.draft === false ?
  # "release" : "draft"`, with no other writer). A green run therefore produces a
  # release nobody can see: drafts are excluded from `releases/latest`, which is
  # exactly what electron-updater polls, and the download links 404. So the release is
  # published here, once, after all three runners have finished — publishing per-job
  # would open the release as soon as the fastest platform landed and leave users
  # downloading a half-finished one.
  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          assets="$(gh release view "$tag" --json assets --jq '.assets[] | select(.name | endswith(".blockmap") | not) | .name' | sed 's/^/- /')"
          body="$(cat <<EOF
          Built by CI from the commit tagged \`$tag\`.

          $assets

          ## Read this first

          - **macOS:** the build is unsigned and un-notarised — there is no Developer ID
            certificate in this repo's secrets yet. If Gatekeeper refuses to open it, go to
            System Settings ▸ Privacy & Security ▸ **Open Anyway**. macOS 15 removed the
            right-click ▸ Open override, so use the settings pane.
          - **Windows portable (\`-Portable-\`):** a single exe with no installed copy, so it
            **cannot self-update**. Use the \`-Setup-\` installer for automatic updates.
          - **Linux AppImage** needs \`libfuse2\` on recent distros, and it is also the only
            Linux format that self-updates (deb and rpm have no updater here).

          Installed Windows builds, AppImage files and macOS builds check this release for
          updates automatically.
          EOF
          )"
          gh release edit "$tag" --draft=false --latest --title "$tag" --notes "$body"
          gh release view "$tag" --json isDraft,assets --jq '"draft: \(.isDraft)  assets: \(.assets | length)"'
